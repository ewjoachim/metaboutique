[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
htpy-uikit = { git = "https://github.com/dakixr/htpy-uikit.git" }

[project]
name = "metaboutique"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Joachim Jablon", email = "ewjoachim@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["atproto>=0.0.63", "htpy>=25.10.0"]

[project.scripts]
metaboutique = "metaboutique:main"

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "htpy-uikit",
    "pdbpp>=0.11.7",
]

[tool.basedpyright]
exclude = [".venv"]
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportUnreachable = false

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "I",   # isort
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "RUF", # ruff
]
fixable = ["ALL"]
extend-ignore = [
    "E501", # line too long
]
